name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      # Runs the Supabase store and migration tests (row-level security) for real.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,llm,api]"
      # Mock mode and no key: the suite must never reach the real API. The grep fails the
      # job if the Postgres-backed tests skipped instead of running.
      - run: |
          pytest -q -rs | tee pytest.log
          ! grep -q "No Postgres" pytest.log
        env:
          ADVISOR_LLM: mock
          ANTHROPIC_API_KEY: ""
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build   # typecheck + production bundle
      - run: npm test
