[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisor-engine"
version = "0.10.0"
description = "Quantitative engine for advisor decision support (prototype)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
llm = ["anthropic>=2.3"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The parked advisor product's tests (see CLAUDE.md, "The advisor product is frozen"):
# files that only exercise advisor-specific modules. `pytest -m advisor` runs them alone.
markers = [
    "advisor: exercises only advisor-specific modules (risk, holdings, market data, stress, questionnaire, household profile, asset classes, charts)",
]
addopts = "--strict-markers"
