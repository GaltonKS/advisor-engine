<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>GaltonKS</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center;
           height: 100vh; margin: 0; background: #000815; color: #FFFCF4; }
    main { text-align: center; max-width: 420px; padding: 0 16px; }
    h1 { font-family: Georgia, serif; font-weight: normal; font-size: 26px; margin: 0 0 12px; }
    p { color: #b9bfca; line-height: 1.5; }
    code { color: #e3ad33; }
    button { margin-top: 16px; padding: 9px 22px; font-size: 15px; cursor: pointer;
             background: #e3ad33; color: #000815; border: 0; border-radius: 6px; }
    .rule { width: 48px; height: 2px; background: #e3ad33; margin: 0 auto 20px; }
  </style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <h1>Can’t reach GaltonKS</h1>
    <p id="msg">Check your internet connection, then try again.</p>
    <button id="retry">Try again</button>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const target = q.get("retry");
    if (q.get("local") === "1") {
      document.getElementById("msg").innerHTML =
        "Nothing is answering at <code></code>. Start the API and the web app " +
        "(see <code>desktop/README.md</code>), then try again.";
      document.querySelector("#msg code").textContent = target;
    }
    document.getElementById("retry").onclick = () => {
      if (target && /^https?:/.test(target)) location.href = target;
    };
  </script>
</body>
</html>
